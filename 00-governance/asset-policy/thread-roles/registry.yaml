    title: "方案分析与产品决策"
    axis: "lifecycle"
    primary_stage: "02-solution-analysis"
    contract: "L02.md"
    primary_paths: ["02-solution-analysis/proposals/", "02-solution-analysis/decisions/"]
  - id: L03
