version: 7
updated_at: "2026-07-18"
authority: "00-governance/asset-policy/thread-roles"
binding_rule: "仓库契约优先于 thread 标题和旧对话上下文"
policy_layers:
  common_execution_rules: "AGENTS.md"
  machine_governance_strategy: "00-governance/asset-policy/thread-roles/registry.yaml"
  resident_contract_scope: "resident_specific_responsibilities_boundaries_and_exceptions_only"
  capability_contract_scope: "reusable_domain_responsibilities_paths_and_boundaries_only"
  forbid_common_rule_duplication_in_contracts: true
work_item_policy:
  execution_model: "one_requirement_one_thread"
  work_id_required: true
  template: "REQUIREMENT_THREAD_TEMPLATE.md"
  creation: "on_real_requirement_only"
  user_facing_owner: "work_item_thread"
  lifecycle_coverage: "discovery_through_closeout"
  capability_loading: "load_required_capabilities_in_same_thread"
  final_accountability: "work_item_thread"
  close_conditions: ["acceptance_met", "validation_recorded", "remaining_risks_reported"]
subagent_policy:
  enabled: true
  authorization: "project_contract"
  orchestrator: "work_item_thread"
  capability_named_agents: "allowed"
  concurrency: "platform_limit"
  minimum_useful_fanout: true
  write_policy: "disjoint_paths_or_isolated_worktree"
  result_flow: "summarize_to_parent"
  durable_authority: "parent_work_item_thread"
review_policy:
  default_full_suite_runs: 1
  reviewer_execution: "parent_or_temporary_subagents_based_on_risk"
  dedicated_resident_reviewer_required: false
  review_levels: ["R0-self-check", "R1-evidence-review", "R2-risk-critical-rerun", "R3-full-independent-release-gate"]
resident_threads:
  - id: G00
    title: "G00｜项目治理与工作项协调"
    axis: "governance"
    primary_stage: "00-governance"
    thread_id: "019f7291-f03f-7933-b867-81b7d4e7cb45"
    contract: "G00.md"
    primary_paths: ["AGENTS.md", "00-governance/"]
  - id: L01
    title: "L01｜需求发现与验证闭环"
    axis: "lifecycle-evidence"
    primary_stage: "01-discovery"
    covered_stages: ["01-discovery", "05-validation"]
    thread_id: "019f6a44-2b9e-75d2-a56d-6d786d5c3a72"
    contract: "L01.md"
    primary_paths: ["01-discovery/workpackages/", "05-validation/reports/", "05-validation/workpackages/"]
capabilities:
