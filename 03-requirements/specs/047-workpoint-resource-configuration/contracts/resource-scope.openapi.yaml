openapi: 3.1.0
info:
  title: 工点级资源配置契约增量
  version: 1.0.0
  description: >-
    复用现有资源保存、任务生成、求解和 AI 助手端点；本文只定义 047 新增字段和兼容要求。
paths:
  /api/local-scenario-config:
    put:
      summary: 保存含工点作用域的标准场景配置
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [process_library, logic_rules, resource_pools]
              properties:
                resource_pools:
                  type: array
                  items:
                    $ref: '#/components/schemas/ResourcePool'
      responses:
        '200':
          description: 返回标准化配置
        '422':
          description: 数量、工点身份或作用域校验失败
  /api/generate-schedule-input:
    post:
      summary: 从场景生成含显式工点作用域的 ScheduleInput
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScenarioInputResourceFragment'
      responses:
        '200':
          description: 生成命名资源、候选和资源作用域摘要
        '422':
          description: 项目主数据版本或受限资源配置无效
  /api/solve-scenario:
    post:
      summary: 固定资源求最短工期
      responses:
        '200':
          description: quantity 容量结果及共享转场 0 天诊断
  /api/solve-min-resources:
    post:
      summary: 固定工期求最少资源
      responses:
        '200':
          description: 推荐量可低于 quantity，但不高于 max_quantity
  /api/ai-resource-assistant/update-plan:
    post:
      summary: 更新共享或独享的 AI 资源数量建议
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResourceAssistantUpdatePlanRequest'
      responses:
        '200':
          description: 保留原作用域并使旧求解/解释失效
        '422':
          description: 旧格式用于独享、未知工点或超上限
components:
  schemas:
    ResourceScopeMode:
      type: string
      enum: [PROJECT_SHARED, WORKPOINT_EXCLUSIVE]
      default: PROJECT_SHARED
    WorkpointResourceOverride:
      type: object
      required: [workpoint_id]
      properties:
        workpoint_id:
          type: string
          minLength: 1
        enabled:
          type: [boolean, 'null']
          default: null
        quantity:
          type: [integer, 'null']
          minimum: 0
          default: null
        max_quantity:
          type: [integer, 'null']
          minimum: 0
          default: null
    ResourcePool:
      type: object
      required: [id, type, label, quantity, enabled]
      properties:
        id: { type: string }
        type: { type: string }
        label: { type: string }
        resource_mode:
          type: string
          enum: [LIMITED, UNLIMITED]
          default: LIMITED
        scope_mode:
          $ref: '#/components/schemas/ResourceScopeMode'
        quantity:
          type: [integer, 'null']
          minimum: 0
        max_quantity:
          type: [integer, 'null']
          minimum: 0
        enabled: { type: boolean }
        authorized_workpoint_ids:
          description: null 表示当前项目版本全部桥梁工点；显式空数组不等于全部
          type: [array, 'null']
          items: { type: string }
        workpoint_overrides:
          type: array
          items:
            $ref: '#/components/schemas/WorkpointResourceOverride'
    NamedResourceScope:
      type: object
      required: [scope_mode, eligible_workpoint_ids]
      properties:
        scope_mode:
          $ref: '#/components/schemas/ResourceScopeMode'
        eligible_workpoint_ids:
          type: array
          minItems: 1
          items: { type: string }
        exclusive_workpoint_id:
          type: [string, 'null']
    ScenarioInputResourceFragment:
      type: object
      required: [project_data_version_id, resource_pools]
      properties:
        project_data_version_id: { type: string }
        resource_pools:
          type: array
          items:
            $ref: '#/components/schemas/ResourcePool'
    ScopedResourceQuantityUpdate:
      type: object
      required: [resource_pool_id, quantity]
      properties:
        resource_pool_id: { type: string }
        workpoint_id:
          type: [string, 'null']
          description: 共享为 null；独享必须填写
        quantity:
          type: integer
          minimum: 0
    ResourceAssistantUpdatePlanRequest:
      type: object
      required: [plan_id]
      properties:
        plan_id: { type: string }
        resource_updates:
          description: 旧共享格式；不得用于 WORKPOINT_EXCLUSIVE
          type: object
          additionalProperties:
            type: integer
            minimum: 0
        scoped_resource_updates:
          type: array
          items:
            $ref: '#/components/schemas/ScopedResourceQuantityUpdate'
x-invariants:
  - max_quantity >= quantity 对每个标准化有效池成立
  - 未配置工点继承全局默认，不转换为 UNLIMITED
  - 固定工期最少资源的下界不读取 quantity
  - 候选按 type 与显式工点字段筛选，禁止解析 resource id
  - PROJECT_SHARED 跨工点转场时间为 0 天且必须提示
