<text x="35" y="752" font-size="13" fill="#627488">A左两次作业的横向位置完全相同，后一次位于外侧。箭线为施工顺序示意，不表示段内行驶轨迹或真实道路。</text>
<text x="35" y="775" font-size="12" fill="#7c8998">设计示意，非真实排程结果；正式界面提供单机选择、全程/前后切换、时间放大和工序详情。</text>
